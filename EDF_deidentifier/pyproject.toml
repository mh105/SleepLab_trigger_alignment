[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edf-deidentifier"
version = "0.1.0"
description = "Local desktop application for narrowly scoped EDF pseudonymization"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6-Essentials==6.11.1",
]

[project.optional-dependencies]
build = [
    "PyInstaller==6.21.0",
]
test = [
    "pytest>=8.3,<10",
]

[project.scripts]
edf-deidentifier = "edf_deidentifier.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
